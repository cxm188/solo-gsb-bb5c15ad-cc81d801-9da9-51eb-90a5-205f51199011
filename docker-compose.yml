services:
  edl-checker:
    build:
      context: .
      dockerfile: Dockerfile
    image: edl-checker:latest
    container_name: edl-checker
    ports:
      # 宿主机端口:容器端口；如需改宿主机端口，设置环境变量 HOST_PORT，例如：
      #   HOST_PORT=8080 docker compose up --build
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
